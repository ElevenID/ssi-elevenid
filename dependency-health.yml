version: 1
dependencies:
  - package: spruceid/ssi
    ecosystem: git
    owner: ElevenID
    upstream: https://github.com/spruceid/ssi
    current: upstream-main-with-unused-dependency-removed
    target: resolved
    status: resolved
    decision: remove
    advisories: [GHSA-7gcf-g7xr-8hxj]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-08-17
    rationale: The unused ssi-jwt serde_with dependency was removed in ElevenID/ssi-elevenid#1. UCAN now uses the current serde_with 3 release, so no legacy serde_with version remains in the all-features graph.
  - package: hyperledger/ursa-bbs
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/hyperledger/ursa
    current: "bbs-0.4.1/pairing-plus-0.19/rand-0.7"
    target: maintained-zkryptium-or-current-ssi-bbs-adapter
    status: temporary-exception
    decision: replace
    advisories: [GHSA-cq8v-f236-94qc]
    tracking-issue: https://github.com/ElevenID/ssi-elevenid/issues/4
    review-after: 2026-09-09
    rationale: The optional legacy BBS implementation transitively requires rand 0.7. The advisory is low severity and requires a custom logger interaction, but the path is obsolete. Preserve BBS/BLS behavior while replacing the implementation and its pairing types behind interoperability vectors; do not remove the feature merely to clear the alert.
